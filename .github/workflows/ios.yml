# iPhone uygulaması
#
# İki yol birlikte çalışır:
#   1) Expo Go + EAS Update (ücretsiz): her push EAS Update ile yayınlanır.
#   2) TestFlight: "build" eylemi yeni bir derleme yapıp TestFlight'a gönderir.
#      runtimeVersion "sdkVersion" politikasında kaldığı için aynı EAS Update hem Expo Go'ya hem
#      TestFlight uygulamasına gider; yeni derleme yalnızca yerel (native) değişiklikte gerekir.
#
#   - "setup": Expo projesini oluşturur/bağlar (bir kez, yapıldı)
#   - "secrets": Gemini anahtarını ve sürüm etiketini EAS ortamına aktarır (derlemelerden önce bir kez)
#   - "build": TestFlight'a yeni derleme. Apple sertifikaları ilk kez bilgisayarda etkileşimli
#     "eas build" ile oluşturulmalıdır (EAS bunu etkileşimsiz yapamaz); sonrası buradan çalışır.
#     TestFlight'a gönderim için uygulama numarası (ascAppId) App Store Connect anahtarıyla otomatik bulunur.
#   Gerekli secret'lar: EXPO_TOKEN, GEMINI_API_KEY
#   "build" için ayrıca: ASC_API_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID (App Store Connect API anahtarı, Admin)
name: iPhone uygulaması

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'update (güncellemeyi elle yayınla) | build (TestFlight) | submit (son derlemeyi TestFlight''a gönder) | secrets (anahtarları EAS''e aktar) | setup (bir kez)'
        required: true
        default: update
        type: choice
        options: [update, build, submit, secrets, setup]
      ref:
        description: 'Geri dönüş (update ile): yayınlanacak commit (CHANGELOG.md''deki kısa kod). Boş = en son sürüm.'
        required: false
        default: ''
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
  HAS_ASC: ${{ secrets.ASC_API_KEY_P8 != '' }}
  EXPO_PUBLIC_SUPABASE_URL: https://fzhagwcysltvpcgdfrnl.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN
  EXPO_PUBLIC_VISION_PROVIDER: gemini
  EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - name: Expo anahtarı yoksa atla
        if: env.HAS_EXPO != 'true'
        run: echo "EXPO_TOKEN tanımlı değil; iPhone adımları atlanıyor."

      - uses: actions/checkout@v4
        if: env.HAS_EXPO == 'true'
        with:
          fetch-depth: 0 # geri dönüşte kısa commit kodunu çözebilmek için tüm geçmiş
      - name: Geri dönüş sürümüne geç
        if: env.HAS_EXPO == 'true' && github.event.inputs.ref != ''
        env:
          REF: ${{ github.event.inputs.ref }}
        run: git checkout --detach "$REF"
      - name: Sürüm etiketini ayarla
        if: env.HAS_EXPO == 'true'
        # Uygulamanın altında görünen commit kodu (geri dönüşte eski commit'in kodu)
        run: echo "EXPO_PUBLIC_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.HAS_EXPO == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_EXPO == 'true'
        run: npm ci
      - name: Tür denetimi, testler ve kod denetimi
        if: env.HAS_EXPO == 'true'
        run: npx tsc --noEmit && npm test && npx expo lint

      # ---------- setup: Expo projesini bağla (bir kez) ----------
      - name: Expo projesini oluştur ve bağla
        if: env.HAS_EXPO == 'true' && github.event.inputs.action == 'setup'
        run: |
          npx eas-cli init --non-interactive --force
          # Expo Go ile uyumlu kalması için runtimeVersion "sdkVersion" politikasında tutulur
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json"));const id=a.expo.extra.eas.projectId;a.expo.updates={...(a.expo.updates||{}),url:"https://u.expo.dev/"+id};a.expo.runtimeVersion={policy:"sdkVersion"};fs.writeFileSync("app.json",JSON.stringify(a,null,2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git diff --cached --quiet || git commit -m "Expo proje kimliğini ekle [skip ci]"
          git push

      # ---------- build: TestFlight'a yeni sürüm ----------
      - name: App Store Connect anahtarını hazırla (varsa)
        if: env.HAS_EXPO == 'true' && (github.event.inputs.action == 'build' || github.event.inputs.action == 'submit') && env.HAS_ASC == 'true'
        # Gizli değerler komut metnine gömülmez, ortam değişkeniyle aktarılır (tırnak/$ içeren değerler kabuğu bozmasın)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/asc-key.mjs "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL" >> "$GITHUB_ENV"
      - name: Gizli anahtarları EAS'e aktar
        if: env.HAS_EXPO == 'true' && (github.event.inputs.action == 'build' || github.event.inputs.action == 'secrets')
        run: |
          npx eas-cli env:set --name EXPO_PUBLIC_GEMINI_API_KEY --value "$EXPO_PUBLIC_GEMINI_API_KEY" \
            --environment production --visibility sensitive --non-interactive
          npx eas-cli env:set --name EXPO_PUBLIC_APP_VERSION --value "$EXPO_PUBLIC_APP_VERSION" \
            --environment production --visibility plaintext --non-interactive
      - name: TestFlight uygulama numarasını bul (ascAppId)
        if: env.HAS_EXPO == 'true' && (github.event.inputs.action == 'build' || github.event.inputs.action == 'submit') && env.HAS_ASC == 'true'
        # eas.json'da numara yoksa App Store Connect'ten paket kimliğiyle bulunur (yalnızca bu çalıştırma için yazılır).
        # Uygulama kaydı henüz yoksa derleme yine yapılır, TestFlight'a gönderim kayıt açılınca "submit" ile yapılır.
        run: |
          if node -e 'const e=require("./eas.json");process.exit(e.submit?.production?.ios?.ascAppId?0:1)'; then
            echo "ASC_APP_FOUND=true" >> "$GITHUB_ENV"; exit 0
          fi
          if ID=$(node scripts/asc-app-id.mjs); then
            echo "Apple Kimliği: $ID"
            ID="$ID" node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("eas.json"));e.submit.production.ios.ascAppId=process.env.ID;fs.writeFileSync("eas.json",JSON.stringify(e,null,2)+"\n")'
            echo "ASC_APP_FOUND=true" >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect'te uygulama kaydı yok: derleme yapılacak ama TestFlight'a gönderilmeyecek. Kaydı açtıktan sonra 'submit' eylemini çalıştırın."
          fi
      - name: Derle ve TestFlight'a gönder
        if: env.HAS_EXPO == 'true' && github.event.inputs.action == 'build'
        run: |
          if [ "$HAS_ASC" != "true" ]; then
            npx eas-cli build --platform ios --profile production --non-interactive
            exit 0
          fi
          # EAS eksik imza bilgilerini (App Store sertifikası/profili) yalnızca etkileşimli modda oluşturur.
          # Sahte bir terminal açılır ve her soruya varsayılan cevap (Enter) verilir; Apple girişi API anahtarıyla
          # soru sorulmadan yapılır. Bilgiler bir kez oluşunca sonraki derlemelerde soru çıkmaz.
          (while sleep 3; do printf '\r'; done) | CI=false script -qefc \
            "npx eas-cli build --platform ios --profile production" /dev/null
          if [ "$ASC_APP_FOUND" = "true" ]; then
            npx eas-cli submit --platform ios --profile production --latest --non-interactive
          fi
      - name: Derleme hatasının ayrıntısı (EAS kaydı)
        if: failure() && env.HAS_EXPO == 'true' && github.event.inputs.action == 'build'
        # EAS'teki son iOS derlemesinin kayıt dosyalarını indirip hata çevresini yazdırır
        run: |
          npx eas-cli build:list --platform ios --limit 1 --json --non-interactive > "$RUNNER_TEMP/build.json" || exit 0
          node -e 'const b=require(process.argv[1])[0]||{};console.log("Derleme:",b.id,b.status,b.error?.message??"");for(const u of b.logFiles??[])console.log(u)' "$RUNNER_TEMP/build.json" | tee "$RUNNER_TEMP/build.txt"
          for u in $(grep '^https' "$RUNNER_TEMP/build.txt"); do curl -sSL "$u"; echo; done > "$RUNNER_TEMP/eas.log" || true
          node -e '
            const lines=require("fs").readFileSync(process.argv[1],"utf8").split("\n").map(l=>{try{const j=JSON.parse(l);return `[${j.phase??""}] ${j.msg??""}`}catch{return l}});
            const hit=lines.findIndex(l=>/CONFIGURE_XCODE_PROJECT|error|Error|failed/.test(l));
            const from=Math.max(0,lines.findIndex(l=>/CONFIGURE_XCODE_PROJECT/.test(l)));
            console.log(lines.slice(from,from+150).join("\n"));
            console.log("----- son 80 satır -----");
            console.log(lines.slice(-80).join("\n"));
          ' "$RUNNER_TEMP/eas.log"
      - name: Son derlemeyi TestFlight'a gönder
        if: env.HAS_EXPO == 'true' && github.event.inputs.action == 'submit'
        run: |
          if [ "$ASC_APP_FOUND" != "true" ]; then
            echo "::error::App Store Connect'te uygulama kaydı bulunamadı (paket kimliği: com.adba.fistarayici)."; exit 1
          fi
          npx eas-cli submit --platform ios --profile production --latest --non-interactive

      # ---------- push: kod güncellemesini telefona gönder ----------
      - name: Güncellemeyi yayınla (EAS Update)
        if: env.HAS_EXPO == 'true' && (github.event_name == 'push' || github.event.inputs.action == 'update')
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "Expo projesi henüz bağlanmadı (setup çalıştırılmadı); atlanıyor."
            exit 0
          fi
          npx eas-cli update --channel production \
            --message "$EXPO_PUBLIC_APP_VERSION" --platform ios --non-interactive
