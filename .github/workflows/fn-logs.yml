# Supabase Edge Function kayıtlarını YALNIZCA OKUYARAK listeler (son 6 saat): her çağrının süresi,
# durum kodu ve konsol mesajları. Hiçbir şeyi değiştirmez. Yavaşlık/hata teşhisi için elle çalıştırılır.
name: Fonksiyon kayıtları

on:
  workflow_dispatch:
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]
    paths: ['.github/workflows/fn-logs.yml']

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fzhagwcysltvpcgdfrnl
    steps:
      - name: Kayıtlar (salt okunur)
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          tok = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          ref = os.environ["PROJECT_REF"]
          if not tok:
              print("SUPABASE_ACCESS_TOKEN tanimli degil"); raise SystemExit(0)
          end = datetime.now(timezone.utc)
          start = end - timedelta(hours=6)
          def logs(sql):
              q = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": start.strftime("%Y-%m-%dT%H:%M:%S.000Z"), "iso_timestamp_end": end.strftime("%Y-%m-%dT%H:%M:%S.000Z")})
              req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/analytics/endpoints/logs?{q}",
                  headers={"Authorization": f"Bearer {tok}", "User-Agent": "fn-logs"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "body": e.read().decode()[:500]}
          def show(title, data):
              print(f"===== {title} =====")
              rows = data.get("result") if isinstance(data, dict) else None
              if rows is None:
                  print(json.dumps(data, ensure_ascii=False)[:2000]); return
              for r in rows:
                  print(json.dumps(r, ensure_ascii=False)[:600])
          show("cagrilar (sure, durum)", logs(
              "select datetime(timestamp) as t, m.function_id, r.status_code, m.execution_time_ms "
              "from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.response) as r "
              "order by timestamp desc limit 60"))
          show("konsol", logs(
              "select datetime(timestamp) as t, event_message from function_logs order by timestamp desc limit 120"))
