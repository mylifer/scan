# Supabase Edge Function'ını (supabase/functions/analyze-receipt) yayınlar ve Gemini anahtarını
# Supabase'e gizli değer olarak yazar. Böylece anahtar uygulama paketinden çıkarılabilir.
#
# Bir kez gerekenler (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens → "Generate new token"
#   GEMINI_API_KEY         — zaten tanımlı
# Sonra: Actions → "Supabase fonksiyonunu yayınla" → Run workflow.
# Uygulama (web ve iPhone) fişleri bu fonksiyonla okur (EXPO_PUBLIC_VISION_PROVIDER: edge).
# Fonksiyon dosyası değişince de kendiliğinden yayınlanır.
#
# e-Faturalar (qnb-efatura) için ayrıca, isteğe bağlı:
#   QNB_USER, QNB_PASS, QNB_VKN  — QNB eSolutions portal kullanıcı kodu, şifresi, firmanın VKN'si
#   QNB_ALLOWED_EMAILS           — faturaları görebilecek uygulama hesabının e-postası (virgülle birden çok)
# Tanımlı değilse fonksiyon yine yayınlanır ama e-Faturalar ekranı "bilgiler eksik/yetki yok" der.
name: Supabase fonksiyonunu yayınla

on:
  workflow_dispatch:
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QNB_USER: ${{ secrets.QNB_USER }}
      QNB_PASS: ${{ secrets.QNB_PASS }}
      QNB_VKN: ${{ secrets.QNB_VKN }}
      QNB_ALLOWED_EMAILS: ${{ secrets.QNB_ALLOWED_EMAILS }}
      PROJECT_REF: fzhagwcysltvpcgdfrnl
    steps:
      - name: Anahtarları kontrol et
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret'ı tanımlı değil (supabase.com → Account → Access Tokens)."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret'ı tanımlı değil."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Gemini anahtarını Supabase'e gizli değer olarak yaz
        run: npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY"
      - name: QNB secret'larını denetle (değerleri göstermez)
        # Yalnızca uzunluk ve yaygın yazım hataları (kenarda boşluk, tırnak, satır sonu) raporlanır
        run: |
          for v in QNB_USER QNB_PASS QNB_VKN; do
            x="${!v}"
            [ -z "$x" ] && { echo "$v: tanımlı değil"; continue; }
            t=$(printf %s "$x" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            q=yok; [[ "$x" =~ ^[\"\'].*[\"\']$ ]] && q=var
            n=yok; [[ "$x" == *$'\n'* ]] && n=var
            o=yok; printf %s "$x" | LC_ALL=C grep -q '[^ -~]' && o=var
            echo "$v: uzunluk=${#x} kenarda_boşluk=$([ "$t" != "$x" ] && echo var || echo yok) tırnak=$q satır_sonu=$n türkçe/özel_harf=$o"
          done
      - name: QNB bilgilerini Supabase'e gizli değer olarak yaz (tanımlıysa)
        run: |
          # Kopyala-yapıştırla gelen baştaki/sondaki boşluk ve satır sonları temizlenir (ör. şifrenin sonunda Enter)
          trim() { local x="${1//$'\r'/}"; x="${x#"${x%%[![:space:]]*}"}"; x="${x%"${x##*[![:space:]]}"}"; printf %s "$x"; }
          QNB_USER=$(trim "$QNB_USER"); QNB_PASS=$(trim "$QNB_PASS"); QNB_VKN=$(trim "$QNB_VKN")
          if [ -n "$QNB_USER" ] && [ -n "$QNB_PASS" ] && [ -n "$QNB_VKN" ] && [ -n "$QNB_ALLOWED_EMAILS" ]; then
            npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" \
              QNB_USER="$QNB_USER" QNB_PASS="$QNB_PASS" QNB_VKN="$QNB_VKN" QNB_ALLOWED_EMAILS="$QNB_ALLOWED_EMAILS"
          else
            echo "::warning::QNB_USER, QNB_PASS, QNB_VKN ve QNB_ALLOWED_EMAILS secret'larının hepsi tanımlı değil; e-Faturalar çalışmaz."
          fi
      - name: Fonksiyonları yayınla
        run: |
          npx --yes supabase@latest functions deploy analyze-receipt --project-ref "$PROJECT_REF"
          npx --yes supabase@latest functions deploy qnb-efatura --project-ref "$PROJECT_REF"
      - name: Fonksiyon çalışıyor mu? (girişsiz istek reddedilmeli)
        # Yayındaysa giriş yapılmamış istek 401 alır; 404 fonksiyonun yayınlanmadığını gösterir
        run: |
          # Uygulamanın herkese açık anahtarıyla ama oturumsuz istek: fonksiyonun içindeki kontrol reddetmeli
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/analyze-receipt" \
            -H 'apikey: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN' -H 'Content-Type: application/json' -d '{}')
          echo "Girişsiz istek: HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "::error::Beklenen 401, gelen $CODE"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/qnb-efatura" \
            -H 'apikey: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN' -H 'Content-Type: application/json' -d '{}')
          echo "qnb-efatura girişsiz istek: HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "::error::qnb-efatura: beklenen 401, gelen $CODE"; exit 1; }
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" | grep -q GEMINI_API_KEY \
            || { echo "::error::Supabase'de GEMINI_API_KEY gizli değeri yok"; exit 1; }
