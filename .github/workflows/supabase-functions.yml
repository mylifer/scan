# Supabase Edge Function'ını (supabase/functions/analyze-receipt) yayınlar ve Gemini anahtarını
# Supabase'e gizli değer olarak yazar. Böylece anahtar uygulama paketinden çıkarılabilir.
#
# Bir kez gerekenler (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens → "Generate new token"
#   GEMINI_API_KEY         — zaten tanımlı
# Sonra: Actions → "Supabase fonksiyonunu yayınla" → Run workflow.
# Uygulama (web ve iPhone) fişleri bu fonksiyonla okur (EXPO_PUBLIC_VISION_PROVIDER: edge).
# Fonksiyon dosyası değişince de kendiliğinden yayınlanır.
name: Supabase fonksiyonunu yayınla

on:
  workflow_dispatch:
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PROJECT_REF: fzhagwcysltvpcgdfrnl
    steps:
      - name: Anahtarları kontrol et
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret'ı tanımlı değil (supabase.com → Account → Access Tokens)."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret'ı tanımlı değil."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Gemini anahtarını Supabase'e gizli değer olarak yaz
        run: npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY"
      - name: Fonksiyonu yayınla
        run: npx --yes supabase@latest functions deploy analyze-receipt --project-ref "$PROJECT_REF"
      - name: Fonksiyon çalışıyor mu? (girişsiz istek reddedilmeli)
        # Yayındaysa giriş yapılmamış istek 401 alır; 404 fonksiyonun yayınlanmadığını gösterir
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/analyze-receipt" \
            -H 'Content-Type: application/json' -d '{}')
          echo "Girişsiz istek: HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "::error::Beklenen 401, gelen $CODE"; exit 1; }
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" | grep -q GEMINI_API_KEY \
            || { echo "::error::Supabase'de GEMINI_API_KEY gizli değeri yok"; exit 1; }
