# Web sürümünü GitHub Pages'e yayınlar: https://mylifer.github.io/scan/
name: Web sürümünü yayınla

on:
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Geri dönüş: yayınlanacak commit (CHANGELOG.md''deki kısa kod). Boş = en son sürüm.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Yayın yarıda kesilmesin: çalışan yayın biter, arada gelenlerden yalnızca en yenisi sırada bekler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://fzhagwcysltvpcgdfrnl.supabase.co
      # Publishable key herkese açık olacak şekilde tasarlanmıştır; güvenliği RLS kuralları sağlar
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN
      # Fişler Supabase fonksiyonu (analyze-receipt) üzerinden okunur: Gemini anahtarı sunucuda durur,
      # web sürümüne gömülmez.
      EXPO_PUBLIC_VISION_PROVIDER: edge
      NEXT_PUBLIC_SUPABASE_URL: https://fzhagwcysltvpcgdfrnl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # geri dönüşte kısa commit kodunu çözebilmek için tüm geçmiş
      - name: Geri dönüş sürümüne geç
        if: github.event.inputs.ref != ''
        env:
          REF: ${{ github.event.inputs.ref }}
        run: git checkout --detach "$REF"
      - name: Sürüm etiketini ayarla
        # Uygulamanın altında görünen commit kodu (geri dönüşte eski commit'in kodu)
        run: echo "EXPO_PUBLIC_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kök tür denetimi
        run: npx tsc --noEmit
      - name: Kök testler
        run: npm test
      - name: Kök kod denetimi (lint)
        run: npx expo lint

      # Yeni Next.js web uygulaması (web/ varsa)
      - name: Next.js Web uygulamasını derle
        if: hashFiles('web/package.json') != ''
        run: |
          echo "Next.js 16 Web uygulaması derleniyor..."
          cd web
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          cd ..
          rm -rf dist
          mkdir -p dist
          cp -r web/out/* dist/

      # Eski Expo Web sürümü için fallback (yalnızca web/ yoksa - eski commit'e geri dönüldüğünde)
      - name: Eski Expo Web parçalarını geri yükle
        if: hashFiles('web/package.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: .previous-chunks
          key: web-chunks-${{ github.sha }}
          restore-keys: |
            web-chunks-
      - name: Eski Expo Web derlemesi
        if: hashFiles('web/package.json') == ''
        run: npx expo export --platform web --output-dir dist
      - name: Eski Expo parçalarını pakete ekle
        if: hashFiles('web/package.json') == ''
        run: |
          if [ -d .previous-chunks ]; then
            mkdir -p dist/_expo/static/js/web
            cp -n .previous-chunks/*.js dist/_expo/static/js/web/ 2>/dev/null || true
          fi
          mkdir -p .previous-chunks
          cp -n dist/_expo/static/js/web/*.js .previous-chunks/ 2>/dev/null || true
      - name: Eski Expo parçalarını önbelleğe kaydet
        if: hashFiles('web/package.json') == ''
        uses: actions/cache/save@v4
        with:
          path: .previous-chunks
          key: web-chunks-${{ github.sha }}

      - name: Yapay zekâ anahtarı pakette olmamalı
        # Google API anahtarları "AIza" ile başlar; pakette bulunursa yayın durdurulur
        run: |
          if grep -rlE 'AIza[0-9A-Za-z_-]{35}' dist; then
            echo "::error::Web paketinde bir Google API anahtarı bulundu; yayın durduruldu."
            exit 1
          fi
      - name: Sürüm dosyası (uygulama yeni sürümü buradan anlar)
        run: echo "{\"commit\":\"$EXPO_PUBLIC_APP_VERSION\"}" > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
