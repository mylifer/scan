# Web sürümünü GitHub Pages'e yayınlar: https://mylifer.github.io/scan/
name: Web sürümünü yayınla

on:
  push:
    branches: [claude/pos-receipt-scanner-app-tk3b0z]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Geri dönüş: yayınlanacak commit (CHANGELOG.md''deki kısa kod). Boş = en son sürüm.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://fzhagwcysltvpcgdfrnl.supabase.co
      # Publishable key herkese açık olacak şekilde tasarlanmıştır; güvenliği RLS kuralları sağlar
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7gu66leZ4qgYJPcOpcsh7g_yss8NOyN
      EXPO_PUBLIC_VISION_PROVIDER: gemini
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Anahtarları kontrol et
        run: |
          if [ -z "$EXPO_PUBLIC_GEMINI_API_KEY" ]; then
            echo "::error::GitHub > Settings > Secrets and variables > Actions altına GEMINI_API_KEY secret'ını ekleyin"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Sürüm etiketini ayarla
        # Uygulamanın altında görünen commit kodu (geri dönüşte eski commit'in kodu)
        run: echo "EXPO_PUBLIC_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
