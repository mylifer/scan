<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kaynak simge. PNG'leri üretmek için: node scripts/render-icons.cjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#0A5CE0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002a73" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34E39A" stop-opacity="0"/>
      <stop offset="1" stop-color="#34E39A" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <g id="background"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="foreground">
    <!-- tarama çerçevesi -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232,336 V270 A44,44 0 0 1 276,226 H342"/>
      <path d="M682,226 H748 A44,44 0 0 1 792,270 V336"/>
      <path d="M792,688 V754 A44,44 0 0 1 748,798 H682"/>
      <path d="M342,798 H276 A44,44 0 0 1 232,754 V688"/>
    </g>
    <!-- fiş -->
    <path id="paper" filter="url(#shadow)" fill="#FFFFFF" d="M352,272 A24,24 0 0 1 376,248 H648 A24,24 0 0 1 672,272 V768
      L658.7,756 L645.3,768 L632,756 L618.7,768 L605.3,756 L592,768 L578.7,756 L565.3,768 L552,756 L538.7,768 L525.3,756
      L512,768 L498.7,756 L485.3,768 L472,756 L458.7,768 L445.3,756 L432,768 L418.7,756 L405.3,768 L392,756 L378.7,768
      L365.3,756 L352,768 Z"/>
    <!-- satırlar -->
    <g id="lines" fill="#C9D6EA">
      <rect x="412" y="318" width="200" height="18" rx="9"/>
      <rect x="412" y="374" width="128" height="18" rx="9"/>
      <rect x="560" y="374" width="52" height="18" rx="9"/>
      <rect x="412" y="430" width="104" height="18" rx="9"/>
      <rect x="560" y="430" width="52" height="18" rx="9"/>
      <rect x="412" y="486" width="140" height="18" rx="9"/>
      <rect x="572" y="486" width="40" height="18" rx="9"/>
      <rect x="412" y="600" width="200" height="30" rx="15" fill="#0A5CE0"/>
    </g>
    <!-- tarama ışığı -->
    <rect id="glow" x="300" y="410" width="424" height="110" fill="url(#beam)"/>
    <rect id="scanline" x="290" y="514" width="444" height="12" rx="6" fill="#34E39A"/>
  </g>
</svg>
